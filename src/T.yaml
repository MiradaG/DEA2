openapi: 3.0.0
info:
  title: Combined API Specification
  version: 1.0.0
paths:
  /api/v1/bid/save:
    post:
      summary: Save a new bid
      description: API to save a new bid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BidApiRequest'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
  /api/v1/bid/view:
    get:
      summary: View all bids
      description: API to view all bids.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BidApiRequest'
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
  /api/v1/feedback/save:
    post:
      summary: Save feedback
      description: Endpoint to handle saving feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackApiRequest'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
  /api/v1/feedback/view:
    get:
      summary: View all feedback
      description: Endpoint to handle viewing all feedback
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeedbackApiRequest'
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /api/v1/image/upload:
    post:
      summary: Upload an image
      description: Uploads a single image file.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The image file to upload.
      responses:
        '200':
          description: Successful upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/v1/image/view/{imageName}:
    get:
      summary: Retrieve an image
      description: Retrieves an image by its name.
      parameters:
      - name: imageName
        in: path
        required: true
        description: The name of the image to retrieve.
        schema:
          type: string
      responses:
        '200':
          description: Successful retrieval
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          description: Image not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/v1/image/delete/{imageName}:
    post:
      summary: Delete an image
      description: Deletes an image by its name.
      parameters:
      - name: imageName
        in: path
        required: true
        description: The name of the image to delete.
        schema:
          type: string
      responses:
        '200':
          description: Successful deletion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: Image not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
components:
  schemas:
    BidApiRequest:
      type: object
      properties:
        id:
          type: integer
          description: The id of the bid
        amount:
          type: number
          format: double
          description: The bid amount
        bidder:
          type: string
          description: The bidder's name
      required:
      - id
      - amount
      - bidder
    ApiResponse:
      type: object
      properties:
        message:
          type: string
          description: Response message
        data:
          type: object
          description: Response data
        success:
          type: boolean
          description: Indicates if the operation was successful
    FeedbackApiRequest:
      type: object
      properties:
        name:
          type: string
          description: Name of the user submitting feedback
        email:
          type: string
          format: email
          description: Email address of the user
        comment:
          type: string
          description: Feedback comment
      required:
      - name
      - email
      - comment
