openapi: 3.0.0
info:
  title: Combined API Specification
  version: 1.0.0
paths:
  /api/v1/feedback/save:
    post:
      summary: Save feedback
      description: Endpoint to save feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackApiRequest'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
  /api/v1/feedback/view:
    get:
      summary: View all feedback
      description: Endpoint to view all feedback
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeedbackApiRequest'
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /api/v1/bid/save:
    post:
      summary: Save a new bid
      description: API to save a new bid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BidApiRequest'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
  /api/v1/bid/view:
    get:
      summary: View all bids
      description: API to view all bids.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bid'
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /api/v1/image/upload:
    post:
      summary: Upload an image
      description: Uploads a single image file.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The image file to upload
              required:
              - file
      responses:
        '200':
          description: Successful upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/v1/image/view/{imageName}:
    get:
      summary: Retrieve an image
      description: Retrieves an image by its name.
      parameters:
      - name: imageName
        in: path
        required: true
        description: The name of the image to retrieve
        schema:
          type: string
      responses:
        '200':
          description: Successful retrieval
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          description: Image not found
        '500':
          description: Internal server error
  /api/v1/image/delete/{imageName}:
    delete:
      summary: Delete an image
      description: Deletes an image by its name.
      parameters:
      - name: imageName
        in: path
        required: true
        description: The name of the image to delete
        schema:
          type: string
      responses:
        '200':
          description: Successful deletion
        '404':
          description: Image not found
        '500':
          description: Internal server error
  /api/v1/user/registration:
    post:
      summary: User Registration
      description: Registers a new user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpApiRequest'
      responses:
        '200':
          description: Successful registration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/user/login:
    post:
      summary: User Login
      description: Logs in an existing user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginApiRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/selling/add:
    post:
      summary: Add a new vehicle for selling
      description: Adds a new vehicle to the selling list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellingAddApiRequest'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
  /api/v1/selling/get:
    get:
      summary: Retrieve all vehicles for selling
      description: Retrieves a list of all vehicles available for selling.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SellingAddApiRequest'
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /api/v1/selling/delete/{vehicleId}:
    delete:
      summary: Delete a vehicle from selling list
      description: Deletes a vehicle from the selling list based on its ID.
      parameters:
      - name: vehicleId
        in: path
        required: true
        description: ID of the vehicle to delete
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /api/v1/selling/update:
    put:
      summary: Update vehicle information
      description: Updates the information of a vehicle in the selling list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellingAddApiRequest'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Bad Request
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
components:
  schemas:
    FeedbackApiRequest:
      type: object
      properties:
        comment:
          type: string
          description: The feedback comment
        rating:
          type: integer
          description: The feedback rating
      description: Feedback Api Request
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Indicates if the operation was successful
        message:
          type: string
          description: Message related to the operation
        data:
          type: object
          description: Data returned by the operation (can be null)
          nullable: true
      required:
      - success
      - message
    BidApiRequest:
      type: object
      properties:
        bidAmount:
          type: number
          format: double
        userId:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
      required:
      - bidAmount
      - userId
      - productId
    Bid:
      type: object
      properties:
        id:
          type: integer
          format: int64
        bidAmount:
          type: number
          format: double
        userId:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
    SignUpApiRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        email:
          type: string
      required:
      - username
      - password
      - email
    LoginApiRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
      - username
      - password
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          default: false
        message:
          type: string
        errors:
          type: array
          items:
            type: string
      required:
      - success
      - message
    SellingAddApiRequest:
      type: object
      properties:
        id:
          type: string
          description: Vehicle ID
        make:
          type: string
          description: Vehicle Make
        model:
          type: string
          description: Vehicle Model
        year:
          type: integer
          description: Vehicle Year
        price:
          type: number
          format: float
          description: Vehicle Price
      required:
      - id
      - make
      - model
      - year
      - price
